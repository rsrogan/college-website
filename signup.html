<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raak Arts and Science College</title>
  <!--google fonts-->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />


  <link rel="stylesheet" media="screen and (min-width: 960px)" href="largedevice.css">
  <link rel="stylesheet" media="screen and (max-width: 480px)" href="smalldevice.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,600;0,800;0,900;1,300;1,400;1,600;1,700&display=swap"
    rel="stylesheet" />
  <!-- CSS only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous" />
  <!--font-awesome-->
  <script src="https://kit.fontawesome.com/9282ec8a78.js" crossorigin="anonymous"></script>
  <!-- JavaScript Bundle with Popper -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="main m-5">
    <div class="container">
      <div class="card">
        <div class="mx-auto d-block m-1">
          <img src="https://www.raakasc.edu.in/wp-content/uploads/2021/07/About-us-300x289.png" alt="">
        </div>
        <div>
          <h1 class="text-center text-primary">Sign <span class="text-secondary">in</span> </h1>
        </div>
        <div class="p-5 mx-auto d-block m-1">
          <form action="" method="get">
            <div class="form-floating mb-3 col-12">
              <input type="email" class="form-control" id="floatingInput" placeholder="Your Email" required>
              <label for="floatingInput">Email</label>
            </div>
            <div class="form-floating mb-3 col-12">
              <input type="name" class="form-control" id="floatingInput" placeholder="Your Name" required>
              <label for="floatingInput">Name</label>
            </div>
            <div class="form-floating mb-3 col-12">
              <input type="date" class="form-control" id="floatingInput" placeholder="DOB" required>
              <label for="floatingInput">DOB</label>
            </div>
            <div class="form-floating mb-3 col-12">
              <input type="number" class="form-control" id="floatingInput" placeholder="Number" required>
              <label for="floatingInput">Mobile Number</label>
            </div>
            <div class="form-floating mb-3 col-12">
              <input type="password" class="form-control" id="floatingInput" placeholder="Your password" required>
              <label for="floatingInput">Password</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="validationServer21" required>
              <label class="form-check-label" for="gridCheck">
                I declare that the above particulars furnished are true and that if anything is found false, I will abide
                by
                the decision of the authorities concerned.
              </label>
            </div>
              <div class="col-12 m-3">
                <button class="btn btn-outline-primary" type="submit">Sign-in </button>
              </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>
<!-- java script start here -->

<!-- java script end here -->

</html>
