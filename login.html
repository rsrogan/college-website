<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raak Arts and Science College</title>
  <!--google fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />


  <link rel="stylesheet" media="screen and (min-width: 960px)" href="largedevice.css">
  <link rel="stylesheet" media="screen and (max-width: 480px)" href="smalldevice.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,600;0,800;0,900;1,300;1,400;1,600;1,700&display=swap"
    rel="stylesheet" />
  <!-- CSS only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous" />
  <!--font-awesome-->
  <script src="https://kit.fontawesome.com/9282ec8a78.js" crossorigin="anonymous"></script>
  <!-- JavaScript Bundle with Popper -->
  <link rel="stylesheet" href="login.css">
</head>

<body class="">
  <!-- login pge start here -->
  <main id="main">
    <div class="about md-5 mb-5 m-5">
      <div class="container-fluid ">
        <div class="card shadow p-3 mb-5 bg-body rounded">
          <div class="mx-auto d-block m-3">
            <img class="img-fluid" src="https://www.raakasc.edu.in/wp-content/uploads/2021/07/About-us-300x289.png"
              alt="">
          </div>
          <h2 class="h2-responsive fw-bold text-center my-2 text-primary">LOG -<span class="text-secondary">IN</span>
          </h2>
          <!--section head end-->
          <div class=" mx-auto d-block m-3">

            <div class="mx-auto d-block m-3">
              <form action="" class="needs-validation">
                <div class="form-floating mb-3 col-12">
                  <input type="email" class="form-control" id="floatingInput" placeholder="Your Email" required>
                  <label for="floatingInput">Email</label>
                </div>
                <div class="form-floating mb-3 col-12">
                  <input type="password" class="form-control" id="floatingInput" placeholder="Your password" required>
                  <label for="floatingInput">Password</label>
                </div>

                <div class="col-12 m-3">
                  <button class="btn btn-outline-primary" type="submit">Login </button>
                </div>
              </form>
              <div>
                <span class="text-secondary m-3">Create New Account <a href="signup.html"
                    class="text-primary">sign-in</a></span>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>
  <!-- login page end here -->
  <!-- javascript start here -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8"
    crossorigin="anonymous"></script>
  <script>
    // Example starter JavaScript for disabling form submissions if there are invalid fields
    (() => {
      'use strict'

      // Fetch all the forms we want to apply custom Bootstrap validation styles to
      const forms = document.querySelectorAll('.needs-validation')

      // Loop over them and prevent submission
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }

          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
  <!-- javascript end here -->
</body>

</html>
